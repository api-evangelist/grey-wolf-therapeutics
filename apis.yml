name: Grey Wolf Therapeutics
description: Grey Wolf Therapeutics (Greywolf Therapeutics) is a clinical-stage biotechnology company
  developing a new therapeutic class of immunotherapies through antigen modulation, aimed at treating
  people living with cancers and autoimmune disorders. Its approach modulates antigen presentation on
  cell surfaces so T cells can correctly recognize and target diseased cells, and it is pioneering
  modulation of Signal 1 in the T cell activation cascade. Lead assets include GRWD5769, a first-in-class
  oral ERAP1 inhibitor for oncology in Phase 1/2 trials, and GRWD0715, an autoimmunity-focused asset also
  in Phase 1/2. Backed by Canaan Partners, the company was added to the API Evangelist network as a
  venture-portfolio company profile. It is a corporate/scientific organization and publishes no public
  developer API, OpenAPI, SDK, or developer portal.
